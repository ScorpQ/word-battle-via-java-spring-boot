# Bu dosya repoda durur ve gizli bilgi icermez: butun degerler ortam
# degiskeninden okunur, varsayilanlar ise lokal docker-compose kurulumudur.
# Canlida Render'in Environment sekmesinden DATABASE_* degiskenleri verilir.

spring.application.name=word-battle

# Render dinlenecek portu PORT degiskeniyle bildiriyor.
server.port=${PORT:8081}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wordbattle}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase gibi havuzlanmis baglantilarda kucuk havuz yeterli; ucretsiz
# planlarin baglanti limitine takilmamak icin bilinctli olarak dusuk.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# WebSocket el sikismasinda kabul edilecek origin'ler.
# Tek servis olarak yayinlandigi icin canlida kendi alan adi yeterli.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
